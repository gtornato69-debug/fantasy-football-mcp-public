services:
  - type: web
    name: fantasy-football-mcp-server
    runtime: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python fastmcp_server.py"
    healthCheckPath: /health
    numInstances: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DEBUG
        value: false
      - key: HOST
        value: 0.0.0.0
      - key: FF_ALLOW_PUBLIC_HTTP
        value: "1"
      - key: FF_AUTH_JWKS_URI
        sync: false
      - key: FF_AUTH_ISSUER
        sync: false
      - key: FF_AUTH_AUDIENCE
        sync: false
      - key: FF_AUTH_BASE_URL
        sync: false
      - key: FF_AUTH_ALLOWED_CLIENT_IDS
        sync: false
      - key: YAHOO_CLIENT_ID
        sync: false
      - key: YAHOO_CLIENT_SECRET
        sync: false
      - key: YAHOO_ACCESS_TOKEN
        sync: false
      - key: YAHOO_REFRESH_TOKEN
        sync: false
      - key: YAHOO_GUID
        sync: false
      - key: PORT
        value: 8080
